<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nexora</title>
<meta name="theme-color" content="#F6F6F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nexora">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --acc:#1569C2; --acc-dk:#1565c0; --acc-2:#64b5f6; --acc-wash:#e3f2fd; --acc-line:#bbdefb;
  --ink:#16161A; --body:#3C3C43; --grey:#64646E; --faint:#6B6B75;
  --paper:#F6F6F8; --paper-2:#EDEDF1; --card:#FFFFFF; --line:#E3E3E8; --line-soft:#EFEFF2;
  --ok:#00897b; --ok-wash:#e0f2f1; --ok-dk:#00695c;
  --run:#F26B2A; --run-dk:#C9501A; --run-wash:#FFF0E7; --run-line:#FFD3BC;
  --warn:#E08A24; --warn-wash:#FCF2E3;
  --coral:#E0574F; --coral-wash:#FDEDEC;
  --gold:#B7861A; --gold-wash:#FBF4E2;
  --on:#FFFFFF;--accFg:#FFFFFF;
  --mus:#C9C9D2; --mus-hi:#1e88e5; --mus-sec:#90caf9;
  --fig:#1e88e5; --fig-far:#90caf9; --fig-ghost:#9A9AA4; --eq:#7A7A85; --eq-soft:#DEDEE4;
  --sh-xs:0 1px 2px rgba(20,20,40,.05);
  --sh-sm:0 1px 3px rgba(20,20,40,.06),0 1px 2px rgba(20,20,40,.04);
  --sh-md:0 6px 20px rgba(20,20,40,.09);
  --sh-lg:0 16px 44px rgba(20,20,40,.16);
  --r-lg:22px; --r:16px; --r-sm:12px;
  --safe-top:env(safe-area-inset-top); --safe-bot:env(safe-area-inset-bottom);
  --glass:rgba(246,246,248,.9); --illus-a:#FBFBFD; --illus-b:#F1F1F6;
}
:root[data-theme="dark"]{
  --acc:#64b5f6; --acc-dk:#90caf9;--accFg:#0B1F33; --acc-2:#1e88e5; --acc-wash:#102a43; --acc-line:#1c3f63;
  --ink:#F3F3F6; --body:#D4D4DC; --grey:#9B9BA7; --faint:#9A9AA6;
  --paper:#0F0F14; --paper-2:#1C1C24; --card:#17171E; --line:#2C2C36; --line-soft:#23232C;
  --ok:#26a69a; --ok-wash:#0e2724; --ok-dk:#4db6ac;
  --run:#FF8A4C; --run-dk:#FFA877; --run-wash:#2B1A10; --run-line:#5A3018;
  --warn:#E8A34A; --warn-wash:#2B2110; --coral-wash:#2C1715;
  --gold:#E0B44B; --gold-wash:#2A2313;
  --mus:#3B3B47; --mus-hi:#64b5f6; --mus-sec:#2a4a75;
  --fig:#64b5f6; --fig-far:#2f5687; --fig-ghost:#5C5C68; --eq:#8A8A96; --eq-soft:#2E2E39;
  --glass:rgba(15,15,20,.9); --illus-a:#1B1B23; --illus-b:#15151B;
  --sh-xs:0 1px 2px rgba(0,0,0,.3); --sh-sm:0 1px 3px rgba(0,0,0,.34);
  --sh-md:0 6px 20px rgba(0,0,0,.42); --sh-lg:0 16px 44px rgba(0,0,0,.55);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--body);min-height:100%;font-size:16px;line-height:1.45;padding-bottom:calc(76px + var(--safe-bot));-webkit-font-smoothing:antialiased}
body.nonav{padding-bottom:24px}
button{font-family:inherit;font-size:inherit;border:none;background:none;cursor:pointer;color:inherit;text-align:inherit}
input,select,textarea{font-family:inherit}
h1,h2,h3{color:var(--ink);letter-spacing:-.022em}
.hidden{display:none!important}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic.s{width:16px;height:16px}.ic.xs{width:13px;height:13px}.ic.l{width:26px;height:26px}
.mini{font-size:.8rem;color:var(--grey)}
.ink{color:var(--ink)}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}

main{padding:calc(14px + var(--safe-top)) 16px 16px;max-width:560px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.top .eyb{margin-bottom:2px}
.top h2{font-size:1.6rem;line-height:1.12}
.eyb{font-size:.7rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--acc)}
.avbtn{width:40px;height:40px;border-radius:50%;background:var(--acc-wash);color:var(--acc-dk);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;font-size:.95rem}
.avbtn .dot{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:var(--faint);border:2px solid var(--paper)}
.avbtn .dot.on{background:var(--ok)}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--paper-2);color:var(--body);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stack{display:flex;flex-direction:column;gap:11px}

.card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--sh-sm);padding:14px}
.card .ch{font-weight:750;color:var(--ink);margin-bottom:9px;display:flex;align-items:center;gap:9px;font-size:.96rem}
.card .ch .cbx{width:28px;height:28px;border-radius:9px;background:var(--acc-wash);color:var(--acc);display:flex;align-items:center;justify-content:center}
.card .ch .r{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--acc)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:var(--accFg);font-weight:800;padding:14px 20px;border-radius:15px;box-shadow:var(--sh-sm);transition:transform .1s,opacity .15s;font-size:1rem;text-align:center}
.btn:active{transform:scale(.975)}
.btn.wide{width:100%}
.btn.ok{background:var(--ok)}
.btn.run{background:var(--run)}
.btn.ghost{background:var(--card);color:var(--acc);border:1.5px solid var(--line);box-shadow:none}
.btn.grey{background:var(--paper-2);color:var(--body);box-shadow:none}
.btn.white{background:var(--on);color:var(--acc-dk)}
.btn.sm{padding:9px 14px;font-size:.88rem;border-radius:12px}
.btn:disabled{opacity:.45}
.lnk{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;font-weight:750;color:var(--acc);padding:6px 2px}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:.9rem;font-weight:650;color:var(--body)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accFg)}
.chip.sm{padding:6px 11px;font-size:.82rem}
.chip.day{width:42px;height:42px;padding:0;justify-content:center;border-radius:13px}
.q{display:flex;flex-direction:column;gap:9px}
.q .ql{font-weight:750;color:var(--ink);font-size:.98rem}
.q .qs{font-size:.8rem;color:var(--grey);margin-top:-6px}

/* ---------- onboarding ---------- */
.onb-hero{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px 0 4px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(140deg,var(--acc-dk),var(--acc));display:flex;align-items:center;justify-content:center;color:var(--on);font-weight:850;font-size:1.4rem;letter-spacing:-.04em;margin-bottom:6px}
.onb-hero h2{font-size:1.75rem;line-height:1.12;text-wrap:balance}
.onb-hero p{color:var(--grey)}

/* ---------- semaine ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.6875rem;font-weight:750;color:var(--faint);min-width:0}
.wd .b{width:100%;max-width:42px;aspect-ratio:1;border-radius:12px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:750;color:var(--grey);position:relative}
.wd .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;height:1.2em}
.wd.m .b{background:var(--acc-wash);color:var(--acc-dk);box-shadow:inset 0 0 0 1.5px var(--acc-line)}
.wd.r .b{background:var(--run-wash);color:var(--run-dk);box-shadow:inset 0 0 0 1.5px var(--run-line)}
.wd.x .b{background:var(--run);color:var(--on);box-shadow:none}
.wd.done .b{background:var(--ok);color:var(--on);box-shadow:none}
.wd.today .b{outline:2.5px solid var(--ink);outline-offset:2px}
.wd.today{color:var(--ink)}
.wd.m .lb{color:var(--acc-dk)}.wd.r .lb,.wd.x .lb{color:var(--run-dk)}.wd.done .lb{color:var(--ok-dk)}

/* ---------- carte séance du jour ---------- */
.sess{background:var(--card);border-radius:20px;border:1px solid var(--line-soft);box-shadow:var(--sh-md);overflow:hidden}
.sess-h{padding:15px 16px 13px;background:linear-gradient(150deg,var(--acc-dk),var(--acc));color:var(--on);position:relative}
:root[data-theme="dark"] .sess-h{background:linear-gradient(150deg,#0d3c74,#1565c0)}
.sess.run .sess-h{background:linear-gradient(150deg,var(--run-dk),var(--run))}
:root[data-theme="dark"] .sess.run .sess-h{background:linear-gradient(150deg,#7a2e0c,#b84a16)}
.sess.restday .sess-h{background:linear-gradient(150deg,#5b5f73,#7b8096)}
:root[data-theme="dark"] .sess.restday .sess-h{background:linear-gradient(150deg,#2e3140,#454a5e)}
.sess.weekok .sess-h{background:linear-gradient(150deg,var(--ok-dk),var(--ok))}
.sess-h .k{font-size:.68rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;opacity:.86}
.sess-h .t{font-size:1.42rem;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin:3px 0 3px;padding-right:34px}
.sess-h .m{font-size:.83rem;opacity:.9}
.sess-h .more{position:absolute;top:11px;right:10px;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.17);color:var(--on);display:flex;align-items:center;justify-content:center}
.exr{display:flex;align-items:center;gap:11px;padding:8px 15px;border-top:1px solid var(--line-soft)}
.exr:first-child{border-top:0}
.exr .th{width:42px;height:42px;border-radius:10px;overflow:hidden;background:var(--paper-2);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.exr .th .exmedia{height:42px}
.exr .th .pose{max-width:42px}
.exr .n{flex:1;min-width:0;font-weight:700;color:var(--ink);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exr .n small{display:block;font-weight:600;color:var(--grey);font-size:.74rem}
.exr .w{font-size:.8rem;color:var(--grey);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.exr .w b{color:var(--ink);font-size:.9rem}
.exr .w .up{color:var(--ok-dk);font-weight:800}
.exr.more .n{color:var(--grey);font-weight:600}
.blk{display:flex;align-items:center;gap:11px;padding:8px 15px;border-top:1px solid var(--line-soft);font-size:.9rem}
.blk:first-child{border-top:0}
.blk .z{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--faint)}
.z-facile{background:var(--ok)!important}.z-vite{background:var(--coral)!important}.z-soutenu{background:var(--warn)!important}.z-recup{background:var(--acc-2)!important}.z-course{background:var(--run)!important}
.blk .bt{flex:1;color:var(--ink);font-weight:650}
.blk .bv{color:var(--grey);font-weight:700;font-variant-numeric:tabular-nums;font-size:.85rem}
.sess .act{padding:10px 14px 14px;display:flex;flex-direction:column;gap:6px}
.sess .act .sub{display:flex;justify-content:center;gap:16px}
.sess .note{padding:10px 15px 0;font-size:.82rem;color:var(--grey)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--sh-xs);padding:11px 12px;display:flex;align-items:center;gap:10px;min-width:0}
.tile .ti{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile .tv{font-weight:800;color:var(--ink);font-size:.98rem;line-height:1.15}
.tile .tl{font-size:.74rem;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile>div:last-child{min-width:0}
.ti.fl{background:var(--run-wash);color:var(--run)}
.ti.gl{background:var(--run-wash);color:var(--run)}
.ti.ml{background:var(--ok-wash);color:var(--ok-dk)}
.meal{display:flex;align-items:center;gap:11px;padding:8px 0;border-top:1px solid var(--line-soft)}
.meal:first-child{border-top:0}
.meal .mn{flex:1;font-size:.92rem;color:var(--body)}
.meal .lf{font-size:.72rem;font-weight:750;color:var(--ok-dk);background:var(--ok-wash);border-radius:999px;padding:3px 9px}

/* ---------- programme ---------- */
.setrow-line{display:flex;align-items:center;gap:10px;padding:11px 13px;min-height:44px;border-radius:14px;background:var(--paper-2);font-size:.86rem;color:var(--body);font-weight:650;width:100%}
.setrow-line .go{margin-left:auto;color:var(--acc);font-weight:800;font-size:.82rem;flex-shrink:0}
.setrow-line .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow{display:flex;align-items:center;gap:12px;padding:11px 13px;background:var(--card);border:1px solid var(--line-soft);border-radius:15px;box-shadow:var(--sh-xs);width:100%}
.prow .dn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;flex-shrink:0;background:var(--acc-wash);color:var(--acc-dk)}
.prow.run .dn{background:var(--run-wash);color:var(--run-dk)}
.prow.race .dn{background:var(--run);color:var(--on)}
.prow.done .dn{background:var(--ok);color:var(--on)}
.prow.done .t{color:var(--grey)}
.prow .bd{flex:1;min-width:0}
.prow .t{font-weight:750;color:var(--ink);font-size:.95rem}
.prow .m{font-size:.78rem;color:var(--grey)}
.prow .go{color:var(--faint)}
.prow.today{border-color:var(--ink)}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav .wl{flex:1;font-weight:750;color:var(--ink);font-size:.95rem}
.goal{border-radius:18px;padding:15px;background:var(--card);border:1px solid var(--line-soft);box-shadow:var(--sh-sm)}
.goal .gh{display:flex;align-items:center;gap:11px}
.goal .gi{width:42px;height:42px;border-radius:13px;background:var(--run-wash);color:var(--run);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.goal .gt{font-weight:800;color:var(--ink);font-size:1.05rem;line-height:1.2}
.goal .gs{font-size:.8rem;color:var(--grey)}
.goal .jx{margin-left:auto;text-align:right;flex-shrink:0}
.goal .jx b{display:block;font-size:1.3rem;color:var(--run-dk);line-height:1;letter-spacing:-.02em}
.goal .jx small{font-size:.68rem;font-weight:750;color:var(--grey);text-transform:uppercase;letter-spacing:.06em}
.bar{height:8px;border-radius:999px;background:var(--paper-2);overflow:hidden;margin:12px 0 5px}
.bar i{display:block;height:100%;background:var(--run);border-radius:999px}
.goal .acts{display:flex;gap:8px;margin-top:11px}
.goal .acts .btn{flex:1}
.goal-empty{border:1.5px dashed var(--run-line);background:var(--run-wash);border-radius:18px;padding:15px;display:flex;align-items:center;gap:12px;width:100%}
.goal-empty .gt{font-weight:800;color:var(--ink)}
.pw{border-radius:14px;border:1px solid var(--line-soft);background:var(--card);overflow:hidden}
.pw summary{list-style:none;display:flex;align-items:center;gap:9px;padding:11px 13px;font-weight:750;color:var(--ink);font-size:.92rem;cursor:pointer}
.pw summary::-webkit-details-marker{display:none}
.pw summary .tg{margin-left:auto;font-size:.7rem;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--paper-2);color:var(--grey)}
.pw summary .tg.now{background:var(--run-wash);color:var(--run-dk)}
.pw summary .tg.ok{background:var(--ok-wash);color:var(--ok-dk)}
.pw .pb{padding:0 13px 8px}
.pw .ps{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:.85rem}
.pw .ps .c{width:20px;height:20px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--on);margin-top:1px}
.pw .ps.d .c{background:var(--ok);border-color:var(--ok)}
.pw .ps b{color:var(--ink)}

/* ---------- lecteur de séance ---------- */
.player{position:fixed;inset:0;z-index:100;background:var(--paper);display:none;flex-direction:column}
.player.on{display:flex}
.pl-top{display:flex;align-items:center;gap:9px;padding:calc(8px + var(--safe-top)) 14px 8px;background:var(--paper)}
.pl-prog{flex:1;display:flex;gap:3px;min-width:0}
.pl-prog i{flex:1;height:5px;border-radius:3px;background:var(--paper-2)}
.pl-prog i.on{background:var(--ok)}.pl-prog i.cur{background:var(--acc)}
.pl-body{flex:1;overflow-y:auto;padding:4px 16px 18px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px}
.pl-foot{padding:10px 16px calc(12px + var(--safe-bot));background:var(--paper);border-top:1px solid var(--line-soft)}
.pl-foot .nx{font-size:.8rem;color:var(--grey);text-align:center;margin-top:7px}
.pl-foot .nx b{color:var(--ink)}
.pl-foot .row{display:flex;gap:9px}
.pl-foot .row .btn{flex:1}
.photo{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--illus-a),var(--illus-b));border:1px solid var(--line-soft);height:min(34vh,250px);display:flex;align-items:center;justify-content:center}
.photo .exmedia{height:100%}
.photo .pose{max-width:220px}
.photo .how{position:absolute;left:10px;bottom:10px;background:var(--card);color:var(--ink);font-size:.78rem;font-weight:750;border-radius:999px;padding:6px 11px;display:flex;align-items:center;gap:6px;box-shadow:var(--sh-sm)}
.photo .pr{position:absolute;right:10px;top:10px;display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:800;color:var(--gold);background:var(--gold-wash);border-radius:999px;padding:4px 9px}
.exh .n{font-size:1.38rem;font-weight:800;color:var(--ink);letter-spacing:-.022em;line-height:1.15}
.exh .s{font-size:.84rem;color:var(--grey);margin-top:2px}
.mynote{font-size:.84rem;background:var(--acc-wash);color:var(--acc-dk);border-radius:12px;padding:9px 11px;display:flex;gap:8px}
.sets{display:flex;flex-direction:column;gap:6px}
.setd{display:flex;align-items:center;gap:10px;font-size:.92rem;padding:10px 12px;border-radius:13px;background:var(--ok-wash);color:var(--ok-dk);font-weight:750;font-variant-numeric:tabular-nums;width:100%}
.setd .ck{width:22px;height:22px;border-radius:7px;background:var(--ok);color:var(--on);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.setd .ed{margin-left:auto;font-size:.74rem;font-weight:700;opacity:.75}
.setd.up{background:var(--paper-2);color:var(--grey);font-weight:650}
.setd.up .ck{background:transparent;border:2px solid var(--line)}
.cur-set{background:var(--card);border:2px solid var(--acc);border-radius:18px;padding:12px 12px 13px;box-shadow:var(--sh-sm)}
.cur-set .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.76rem;font-weight:800;color:var(--acc-dk);letter-spacing:.03em}
.cur-set .lbl span:first-child{white-space:nowrap}
.cur-set .lbl span:last-child{color:var(--grey);font-weight:650;letter-spacing:0;text-align:right}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.steps.one{grid-template-columns:1fr}
.stp{border:1.5px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:5px;gap:4px;min-width:0}
.stp button{width:42px;height:46px;border-radius:11px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--ink);font-weight:500;flex-shrink:0;line-height:1}
.stp button:active{background:var(--acc-wash)}
.stp .val{text-align:center;line-height:1.05;min-width:0;flex:1}
.stp .val input{width:100%;border:0;background:transparent;text-align:center;font-size:1.65rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em;padding:0}
.stp .val input:focus{outline:none;color:var(--acc)}
.stp .val input::placeholder{color:var(--faint)}
.stp .val small{display:block;font-size:.68rem;color:var(--grey);font-weight:750}
.hint{font-size:.8rem;color:var(--ok-dk);font-weight:700;display:flex;align-items:center;gap:5px;margin-top:9px}
.hint.grey{color:var(--grey);font-weight:600}
.holdbtn{margin-top:9px;width:100%;border-radius:14px;border:1.5px solid var(--line);padding:14px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:800;color:var(--ink);font-size:1.25rem;font-variant-numeric:tabular-nums}
.holdbtn.on{border-color:var(--acc);color:var(--acc);background:var(--acc-wash)}
.warm-list{display:flex;flex-direction:column;gap:8px}
.warm-list button{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:14px;background:var(--card);border:1px solid var(--line-soft);font-size:.92rem;color:var(--body);width:100%}
.warm-list button .c{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--on)}
.warm-list button.d .c{background:var(--ok);border-color:var(--ok)}
.warm-list button.d{color:var(--grey)}
.bigicon{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:var(--warn-wash);color:var(--warn)}

/* repos */
.rest{position:fixed;inset:0;z-index:130;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(20px + var(--safe-top)) 22px calc(20px + var(--safe-bot));background:linear-gradient(180deg,#0f4c95,#1e88e5);color:var(--on);text-align:center}
.rest.on{display:flex}
.rest .k{font-size:.74rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.ring{width:min(62vw,250px);aspect-ratio:1;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .tx strong{font-size:clamp(3rem,15vw,4.2rem);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.ring .tx small{font-size:.8rem;opacity:.85;font-weight:700;margin-top:6px}
.upn{background:rgba(255,255,255,.14);border-radius:16px;padding:12px 16px;width:100%;max-width:380px}
.upn .k2{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.upn .v{font-size:1.1rem;font-weight:800;margin-top:3px}
.upn .s2{font-size:.85rem;opacity:.86}
.rbtns{display:flex;gap:10px;width:100%;max-width:380px}
.rbtns button{flex:1;border-radius:15px;padding:15px;font-weight:800;font-size:1rem;background:rgba(255,255,255,.17);color:var(--on);text-align:center}
.rbtns button.w{background:#fff;color:#1565c0}

/* course guidée */
.runp{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:var(--paper)}
.runp.on{display:flex}
.run-hero{border-radius:22px;padding:18px 16px;color:var(--on);text-align:center;background:linear-gradient(160deg,var(--run-dk),var(--run))}
.run-hero.z-vite{background:linear-gradient(160deg,#a8322b,#e0574f)!important}
.run-hero.z-recup{background:linear-gradient(160deg,#1565c0,#42a5f5)!important}
.run-hero.z-facile{background:linear-gradient(160deg,#00695c,#26a69a)!important}
.run-hero.z-soutenu{background:linear-gradient(160deg,#b2661a,#e8a34a)!important}
.run-hero .bk{font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.86}
.run-hero .bn{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin:4px 0}
.run-hero .clock{font-size:clamp(3.4rem,18vw,4.8rem);font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1;margin:8px 0}
.run-hero .zd{font-size:.88rem;opacity:.92}
.run-tot{display:flex;justify-content:space-between;font-size:.85rem;color:var(--grey);font-weight:650;font-variant-numeric:tabular-nums}
.blist .blk.cur{background:var(--acc-wash)}
.blist .blk.d .bt{color:var(--faint);text-decoration:line-through}

/* bilan */
.cele{background:linear-gradient(150deg,var(--ok-dk),var(--ok));color:var(--on);border-radius:20px;padding:20px 16px;text-align:center}
.cele.run{background:linear-gradient(150deg,var(--run-dk),var(--run))}
.cele .big{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.cele .s{font-size:.88rem;opacity:.92}
.bstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bstat .st{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);padding:11px 6px;text-align:center;min-width:0}
.bstat .sv{font-size:1.15rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.bstat .sl{font-size:.68rem;color:var(--grey);font-weight:750}
.prline{display:flex;align-items:center;gap:9px;background:var(--gold-wash);border-radius:var(--r-sm);padding:10px 12px;font-size:.88rem;color:var(--body)}
.prline .ic{color:var(--gold)}
.prline b{color:var(--ink)}
.pct{color:var(--ok-dk);font-weight:800;background:var(--ok-wash);border-radius:999px;padding:2px 8px;font-size:.78rem}
.pct.dn{color:var(--grey);background:var(--paper-2)}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.feel button{text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 4px;font-size:.86rem;font-weight:750;color:var(--body);background:var(--card)}
.feel button.on{border-color:var(--acc);background:var(--acc-wash);color:var(--acc-dk)}
ul.simple{margin:0 0 0 18px;display:flex;flex-direction:column;gap:4px;font-size:.88rem}

/* progrès */
.flame{display:flex;align-items:center;gap:13px;background:linear-gradient(140deg,#FF8A3D,#FF6B35);color:#fff;border-radius:18px;padding:14px 15px;box-shadow:var(--sh-sm)}
.flame.off{background:var(--card);color:var(--body);border:1px solid var(--line-soft)}
.flame .fi{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.flame.off .fi{background:var(--paper-2);color:var(--faint)}
.flame .fv{font-size:1.3rem;font-weight:800;line-height:1.1}
.flame.off .fv{color:var(--ink)}
.flame .fl{font-size:.82rem;opacity:.92}
.flame.off .fl{color:var(--grey)}
.wkdots{display:flex;gap:5px;margin-top:7px}
.wkdots i{width:22px;height:6px;border-radius:3px;background:rgba(255,255,255,.32)}
.wkdots i.on{background:#fff}
.flame.off .wkdots i{background:var(--paper-2)}
.flame.off .wkdots i.on{background:var(--acc)}
.chart{width:100%;height:auto;display:block}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.chart .ar{fill:var(--acc-wash)}
.chart .gd{stroke:var(--line-soft);stroke-width:1}
.chart text{font-size:11px;fill:var(--faint);font-weight:700}
.chart .pt{fill:var(--acc)}
.chart .last{fill:var(--card);stroke:var(--acc);stroke-width:2.4}
.recs .rr{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;padding:7px 0;border-top:1px solid var(--line-soft)}
.recs .rr:first-child{border-top:0}
.recs .rr b{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.recs .nw{color:var(--gold);font-weight:800;font-size:.68rem;margin-left:5px;letter-spacing:.04em}
.empty{text-align:center;padding:26px 18px}
.empty .ei{width:58px;height:58px;border-radius:18px;background:var(--acc-wash);color:var(--acc);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.empty h3{font-size:1.1rem;margin-bottom:4px}
.empty p{font-size:.88rem;color:var(--grey);margin-bottom:14px}
details.fold>summary{list-style:none;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .ch{margin-bottom:0}
details.fold[open]>summary .ch{margin-bottom:9px}
details.fold .chev{margin-left:auto;color:var(--faint);transition:transform .2s}
details.fold[open] .chev{transform:rotate(90deg)}

.histcard{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line-soft);width:100%}
.histcard:first-child{border-top:0}
.hc-date{display:flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:50px;border-radius:12px;background:var(--acc-wash);flex-shrink:0;line-height:1.05}
.histcard.run .hc-date{background:var(--run-wash)}
.hc-dow{font-size:.6875rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--acc-dk)}
.hc-day{font-size:1.1rem;font-weight:800;color:var(--acc-dk)}
.histcard.run .hc-dow,.histcard.run .hc-day{color:var(--run-dk)}
.hc-bd{flex:1;min-width:0}
.hc-n{font-weight:750;color:var(--ink);font-size:.92rem}
.hc-m{font-size:.76rem;color:var(--grey)}

.calhead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.calhead .cm{flex:1;text-align:center;font-weight:750;color:var(--ink);font-size:.95rem;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wdh{text-align:center;font-size:.6875rem;font-weight:800;color:var(--faint);text-transform:uppercase;padding-bottom:3px}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.8rem;color:var(--body);background:var(--paper-2);font-weight:600}
.cal .d.mute{background:transparent;color:transparent;pointer-events:none}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .d.has{background:var(--acc-wash);color:var(--acc-dk);font-weight:800}
.cal .d .dots{display:flex;gap:2px;height:5px}
.cal .d .dots i{width:5px;height:5px;border-radius:50%}
.cal .d .dots i.m{background:var(--acc)}
.cal .d .dots i.c{background:var(--run)}
.callg{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:.75rem;color:var(--grey)}
.callg span{display:flex;align-items:center;gap:5px}
.callg i{width:7px;height:7px;border-radius:50%;display:inline-block}
.caldet{margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--paper-2);font-size:.84rem;color:var(--body)}
.vol{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.vol .vn{width:100px;font-size:.8rem;color:var(--body);font-weight:600;flex-shrink:0}
.vol .vb{flex:1;height:9px;border-radius:5px;background:var(--paper-2);overflow:hidden}
.vol .vb i{display:block;height:100%;border-radius:5px;background:var(--acc)}
.vol .vv{width:38px;text-align:right;font-size:.78rem;font-weight:800;color:var(--grey);font-variant-numeric:tabular-nums}

/* corps, illustrations, médias */
.bodymap{display:flex;justify-content:center;padding:4px 0}
.bodymap svg{width:100%;max-width:300px;height:auto}
.bodymap .mus{fill:var(--mus);fill-rule:evenodd;transition:fill .15s}
.bodymap .mus.hi{fill:var(--mus-hi)}
.bodymap .mus.sec{fill:var(--mus-sec)}
.bodymap .sil{fill:var(--paper-2);stroke:var(--line);stroke-width:1;fill-rule:evenodd}
.bodymap.click .mus{cursor:pointer}
.bodymap text{font-size:11px;fill:var(--faint);font-weight:700;text-anchor:middle}
.illus{background:linear-gradient(180deg,var(--illus-a),var(--illus-b));border:1px solid var(--line-soft);border-radius:var(--r);display:flex;align-items:center;justify-content:center;overflow:hidden;height:210px}
.illus .exmedia{height:100%}
.pose{width:100%;max-width:230px;height:auto}
.pose .solid line{stroke:var(--fig);stroke-linecap:round}
.pose .solid .head,.pose .solid .hand{fill:var(--fig)}
.pose .solid .far line{stroke:var(--fig-far)}
.pose .solid .far .hand{fill:var(--fig-far)}
.pose .ghost{opacity:.28}
.pose .ghost line{stroke:var(--fig-ghost);stroke-linecap:round}
.pose .ghost .head,.pose .ghost .hand{fill:var(--fig-ghost)}
.pose .ground{stroke:var(--line);stroke-width:2;stroke-dasharray:3 5}
.pose .eq line{stroke:var(--eq);stroke-linecap:round}
.pose .eqf{fill:var(--eq)}
.pose .eqs{fill:var(--eq-soft)}
.pose .eqw{stroke:var(--eq-soft);stroke-linecap:round}
.pose .eqc{stroke:#B6B6C0;stroke-dasharray:3 3}
.exmedia{position:relative;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:inherit}
.exmedia img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .18s}
.exmedia img.on{opacity:1}
.exmedia .fb{width:100%;display:flex;align-items:center;justify-content:center}
.exmedia .fb.off{visibility:hidden}

/* bibliothèque */
.search{width:100%;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:13px;background:var(--card);color:var(--ink)}
.libtools{display:flex;gap:8px}
.libtools select{flex:1;min-width:0;font-size:.87rem;padding:10px 9px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);font-weight:600;color:var(--ink)}
.libgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.excard{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--sh-sm);overflow:hidden;cursor:pointer;width:100%}
.ex-img{position:relative;aspect-ratio:4/3;background:linear-gradient(160deg,var(--illus-a),var(--illus-b));display:flex;align-items:center;justify-content:center;overflow:hidden}
.ex-img .exmedia{height:100%}
.ex-pr{position:absolute;top:7px;right:7px;display:inline-flex;align-items:center;gap:3px;font-size:.68rem;font-weight:800;color:var(--gold);background:var(--gold-wash);border-radius:999px;padding:3px 7px}
.ex-bd{padding:9px 11px 11px}
.ex-n{font-weight:750;color:var(--ink);font-size:.86rem;line-height:1.25;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.2em}
.ex-m{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ex-tag{font-size:.68rem;font-weight:800;color:var(--acc-dk);background:var(--acc-wash);border-radius:999px;padding:2px 8px}
.ex-eq{font-size:.72rem;color:var(--grey)}
.lex{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:9px 12px;margin-bottom:7px;width:100%}
.lex .thumb{width:50px;height:50px;border-radius:10px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.lex .thumb .exmedia{height:50px}
.lex .thumb .pose{max-width:50px}
.lex .lb{flex:1;min-width:0}
.lex .ln{font-weight:700;color:var(--ink);font-size:.92rem}
.lex .lm{font-size:.77rem;color:var(--grey)}

/* feuilles */
.overlay{position:fixed;inset:0;background:rgba(10,10,20,.36);z-index:140;opacity:0;pointer-events:none;transition:opacity .22s}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:150;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:var(--sh-lg);max-height:92dvh;overflow-y:auto;transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,.35,1);padding:12px 16px calc(20px + var(--safe-bot));max-width:620px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet-close{position:absolute;top:12px;right:14px;width:32px;height:32px;border-radius:50%;background:var(--paper-2);display:flex;align-items:center;justify-content:center;color:var(--grey);z-index:5}
.sheet h3{font-size:1.22rem;font-weight:800;margin-bottom:3px;padding-right:40px}
.sh-sub{font-size:.85rem;color:var(--grey);margin-bottom:14px}
.sheet .stack{gap:14px}
.menu{display:flex;flex-direction:column;background:var(--card);border-radius:16px;border:1px solid var(--line-soft);overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;padding:14px 15px;border-top:1px solid var(--line-soft);font-size:.95rem;font-weight:650;color:var(--ink);width:100%}
.menu button:first-child{border-top:0}
.menu button .ic{color:var(--acc)}
.menu button.danger,.menu button.danger .ic{color:var(--coral)}
.menu button small{display:block;font-size:.76rem;color:var(--grey);font-weight:550}
.fld label{display:block;font-size:.82rem;font-weight:750;color:var(--ink);margin-bottom:6px}
.fld input{width:100%;font-size:16px;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.msg{border-radius:11px;padding:10px 12px;font-size:.85rem}
.msg.err{background:var(--coral-wash);color:#A63A33}
.msg.info{background:var(--run-wash);color:var(--run-dk)}
.seg{display:flex;background:var(--paper-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:9px 4px;border-radius:9px;font-weight:700;font-size:.85rem;color:var(--grey);text-align:center}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh-xs)}
.notebox{width:100%;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);resize:vertical;min-height:70px}
.plates{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.plate{display:flex;flex-direction:column;align-items:center;justify-content:center;width:52px;height:52px;border-radius:12px;background:var(--acc-wash);color:var(--acc-dk);font-weight:800;font-size:.85rem}
.plate small{font-size:.6rem;font-weight:700;opacity:.75}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line-soft);display:flex;padding:6px 10px calc(6px + var(--safe-bot))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.6875rem;font-weight:750;color:var(--faint);padding:4px 0;border-radius:11px}
nav.tabs button.on{color:var(--acc)}
nav.tabs button.on .nic{background:var(--acc-wash)}
nav.tabs .nic{width:48px;height:28px;border-radius:10px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.upd{position:fixed;left:16px;right:16px;bottom:calc(84px + var(--safe-bot));z-index:190;display:flex;align-items:center;gap:12px;padding:12px 10px 12px 16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-md);font-size:.92rem;font-weight:600;color:var(--ink)}
.upd[hidden]{display:none}
.upd span{flex:1;min-width:0}
.upd button{min-height:44px;padding:0 14px;border-radius:999px;background:var(--acc);color:var(--accFg);font-weight:700;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-bot));transform:translateX(-50%) translateY(18px);background:var(--ink);color:var(--paper);padding:10px 17px;border-radius:999px;font-size:.88rem;font-weight:650;opacity:0;transition:.24s;z-index:200;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
main section:not(.hidden){animation:fadeUp .22s ease both}
@media (prefers-reduced-motion:reduce){main section:not(.hidden){animation:none}.sheet,.overlay,.toast{transition:none}}
@media(max-width:360px){.top h2{font-size:1.4rem}.stp button{width:36px}.stp .val input{font-size:1.4rem}}
/* zones tactiles de 44 pt sans changer le dessin (HIG) */
.chip,.lnk,.iconbtn,.avbtn,.seg button{position:relative}
.chip::after{content:"";position:absolute;inset:-4px -2px}
.chip.sm::after{inset:-8px -3px}
.chips:has(.chip.sm){row-gap:15px}   /* 29 px de puce + 15 px d'espace = pas de 44 px, zones tactiles sans chevauchement */
.seg button::after{content:"";position:absolute;inset:-6px 0}
.lnk{min-height:44px}
.lnk::after,.iconbtn::after,.avbtn::after,.sheet-close::after,.sess-h .more::after{content:"";position:absolute;inset:-8px}
.libtools .seg{margin:0}
</style>

function figBody(p,cls){
  const L=(a,b,w)=>a&&b?`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke-width="${w}"/>`:'';
  const d=p.d===undefined?1:p.d;
  const hand=a=>a?`<circle cx="${a[0]}" cy="${a[1]}" r="4" class="hand"/>`:'';
  const foot=a=>(a&&a[1]>155)?`<line x1="${a[0]}" y1="${a[1]}" x2="${a[0]+9*d}" y2="${a[1]}" stroke-width="6" stroke-linecap="round"/>`:'';
  let far=`<g class="far">${L(p.S,p.E2,7)}${L(p.E2,p.W2,7)}${hand(p.W2)}${L(p.P,p.K2,8)}${L(p.K2,p.A2,8)}${foot(p.A2)}</g>`;
  let near=`<g class="near">${L(p.S,p.P,11)}${L(p.P,p.K,9)}${L(p.K,p.A,9)}${foot(p.A)}${L(p.S,p.E,8)}${L(p.E,p.W,8)}${hand(p.W)}`
    +`<circle cx="${p.H[0]}" cy="${p.H[1]}" r="11" class="head"/></g>`;
  return `<g class="${cls}">${far}${near}</g>`;
}
function eqSVG(e){const t=e[0];
  if(t==='bar')return `<g class="eq"><line x1="${e[1]}" y1="${e[2]}" x2="${e[1]+e[3]}" y2="${e[2]}" stroke-width="5"/><rect x="${e[1]-4}" y="${e[2]-9}" width="7" height="18" rx="2" class="eqf"/><rect x="${e[1]+e[3]-3}" y="${e[2]-9}" width="7" height="18" rx="2" class="eqf"/></g>`;
  if(t==='db')return `<g class="eq"><rect x="${e[1]-9}" y="${e[2]-4}" width="18" height="8" rx="3" class="eqf"/><rect x="${e[1]-12}" y="${e[2]-8}" width="6" height="16" rx="2" class="eqf"/><rect x="${e[1]+6}" y="${e[2]-8}" width="6" height="16" rx="2" class="eqf"/></g>`;
  if(t==='bench')return `<rect class="eqs" x="${e[1]}" y="${e[2]}" width="${e[3]}" height="${e[4]}" rx="4"/>`;
  if(t==='pad')return `<rect class="eqs" x="${e[1]}" y="${e[2]}" width="${e[3]}" height="${e[4]}" rx="6"/>`;
  if(t==='step')return `<rect class="eqs" x="${e[1]}" y="${e[2]}" width="${e[3]}" height="${e[4]}" rx="3"/>`;
  if(t==='plate')return `<rect class="eqs" x="${e[1]}" y="${e[2]}" width="12" height="46" rx="4"/>`;
  if(t==='wall')return `<line class="eqw" x1="${e[1]}" y1="30" x2="${e[1]}" y2="182" stroke-width="4"/>`;
  if(t==='cable')return `<line class="eqc" x1="${e[1]}" y1="${e[2]}" x2="${e[3]}" y2="${e[4]}" stroke-width="2.5"/>`;
  return ''}
function poseSVG(id){
  const P=POSES[id];if(!P)return '';
  let s='<svg viewBox="0 0 200 196" xmlns="http://www.w3.org/2000/svg" class="pose">';
  s+='<line class="ground" x1="14" y1="185" x2="186" y2="185"/>';
  (P.eq||[]).forEach(e=>s+=eqSVG(e));
  if(P.g)s+=figBody({...P,...P.g},'ghost');
  s+=figBody(P,'solid');
  return s+'</svg>';
}

function genPlan(g){
  const N=g.N,weeks=[];

      const longKm=r05((st+(peak-st)*t)*f), easy=r5((ef[0]+(ef[1]-ef[0])*t)*f*(deb?.85:1));
      let q;

        const P=d<=5?[60,60,6,10]:d<=10?[120,90,4,7]:[300,120,3,5];

        b.push({t:'Retour au calme',s:300,z:'facile'});
        q={t:'Fractionné',kind:'interval',desc:`${reps} × ${mmss(P[0])} vite, ${mmss(P[1])} de récup`,b};
      } else {
        const tm=r5((10+(d<=5?10:d<=10?15:25)*t)*f);
        q={t:'Allure soutenue',kind:'tempo',desc:`${tm} min à allure soutenue`,b:[{t:'Échauffement',s:600,z:'facile'},{t:'Allure soutenue',s:tm*60,z:'soutenu'},{t:'Retour au calme',s:300,z:'facile'}]};

      const E2={t:'Footing court',kind:'easy',desc:`${r5(easy*.7)} min tranquille`,b:[{t:'Footing',s:r5(easy*.7)*60,z:'facile'}]};
      const L={t:'Sortie longue',kind:'long',desc:`${fmtN(longKm)} km sans forcer`,b:[{t:'Sortie longue',km:longKm,z:'facile'}],km:longKm};
      if(race){
        const pre={t:'Footing et accélérations',kind:'easy',desc:'20 min tranquille puis 4 accélérations de 20 s',b:[{t:'Footing',s:1200,z:'facile'}].concat([1,2,3,4].flatMap(i=>[{t:'Accélération',s:20,z:'vite',rep:i,of:4},{t:'Récup',s:60,z:'recup'}]))};

        s.push({t:'Jour J : '+goalTitle(g),kind:'race',desc:distLabel(g)+(paceTxt(g)?' · allure visée '+paceTxt(g):''),b:[{t:'Course',km:d,z:'course'}],km:d,race:true});

let planCache=null;
function plan(){if(!cardio)return null;const k=JSON.stringify([cardio.id,cardio.sport,cardio.dist,cardio.N,cardio.runs,cardio.level,cardio.name,cardio.target]);

/* jours de la semaine w pour chaque séance */

  const P=plan();if(!P||!P[w])return [];const S=P[w].s;let days=[...cardio.days].sort((a,b)=>a-b);
  if(P[w].race){

    for(const d of [rd-2,rd-3,rd-4,rd-1,rd-5])if(before.length<S.length-1&&d>=0&&!before.includes(d))before.push(d);
    before.sort((a,b)=>a-b);
    return S.map((x,k)=>x.race?rd:before[k]!==undefined?before[k]:Math.max(0,rd-1));

function sessEstSec(s){let t=0;(s.b||[]).forEach(b=>{if(b.s)t+=b.s;else if(b.km)t+=b.km*(cardio&&cardio.sport==='velo'?150:390);else if(b.m)t+=b.m*2.2;else t+=1800});return t}
function blockVal(b){if(b.s){return b.s>=60?(b.s%60?mmss(b.s):(b.s/60)+' min'):b.s+' s'}if(b.km)return fmtN(b.km)+' km';if(b.m)return b.m+' m';return ''}
/* résumé compact des blocs : 6 × (1:00 vite / 1:00 récup) */
function blocksSummary(bl){

    if(b.rep===1&&b.of>1){const nb=bl[i+1];out.push({z:b.z,t:`${b.of} × ${blockVal(b)} ${ZLABEL[b.z]}`+(nb&&nb.z==='recup'?`, ${blockVal(nb)} récup`:''),v:''});
      while(i<bl.length&&(bl[i].rep||bl[i].z==='recup'&&bl[i-1]&&bl[i-1].rep))i++;continue}

/* ================= MUSCU : construction des séances ================= */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const SPLITS={1:[['Full body',[['quadriceps',1],['fessiers',1],['dos',1],['pecs',1],['epaules',1],['ischios',1]]]],
 2:[['Bas du corps',[['quadriceps',2],['ischios',1],['fessiers',2],['mollets',1]]],['Haut du corps',[['dos',2],['pecs',2],['epaules',1],['biceps',1],['triceps',1]]]],
 3:[['Bas du corps et fessiers',[['quadriceps',2],['fessiers',2],['ischios',1],['mollets',1]]],['Haut du corps',[['dos',2],['pecs',2],['epaules',1],['biceps',1]]],['Full body et gainage',[['quadriceps',1],['fessiers',1],['dos',1],['pecs',1],['epaules',1],['triceps',1]]]],
 4:[['Bas du corps',[['quadriceps',3],['ischios',1],['mollets',1],['fessiers',1]]],['Pecs et épaules',[['pecs',2],['epaules',2],['triceps',2]]],['Fessiers et abdos',[['fessiers',3],['quadriceps',1],['ischios',1]]],['Dos et biceps',[['dos',3],['biceps',2],['epaules',1]]]],
 5:[['Bas du corps',[['quadriceps',3],['ischios',2],['mollets',1]]],['Pecs et triceps',[['pecs',3],['triceps',2],['epaules',1]]],['Fessiers',[['fessiers',4],['ischios',1],['mollets',1]]],['Dos et biceps',[['dos',3],['biceps',2],['epaules',1]]],['Full body',[['quadriceps',1],['fessiers',1],['dos',1],['pecs',1],['epaules',1],['biceps',1]]]]};
SPLITS[6]=SPLITS[5].concat([['Full body et gainage',[['quadriceps',1],['fessiers',1],['dos',1],['pecs',1],['epaules',1],['triceps',1]]]]);
const HIIT_POOL=['kneeup','steptouch','squatpc','fentesar','pompesinc','pompesgen','mountain','planche','hollow','birddog','donkey','pontuni','superman','dipsbanc','hipsol','chaise'];
const plOf=place=>place==='hiit'?'maison':place;
function poolFor(g,place){return EXOS.filter(e=>e.g===g&&e.p.includes(plOf(place)))}

function sessionSeed(i,place,wk){return hashStr((wk||weekKey())+'|'+profile.goal+'|'+profile.days+'|'+profile.focus+'|'+place+'|'+(profile.shuffle||0)+'|s'+i)}
function buildSession(i,o){
  o=o||{};const place=o.place||profile.place,dur=o.dur||profile.dur,D=DURS[dur]||DURS[45];
  const r=rng(sessionSeed(i,place,o.wk)+(o.dur&&o.dur!==profile.dur?7919:0));
  const light=isLight(o.wk),nSets=light?Math.max(2,D.sets-1):D.sets,nEx=light?Math.max(3,D.ex-1):D.ex;
  const N=profile.days;
  if(place==='hiit'){
    const moves=shuffled(HIIT_POOL,r).slice(0,6).map(id=>({id,kind:'hold'}));
    return {name:'Circuit léger '+String.fromCharCode(65+i),kind:'hiit',items:moves,cardio:null,sets:light?Math.max(2,D.rounds-1):D.rounds,dur,place,light,
      note:"6 exercices en circuit, 30 s d'effort puis 30 s de repos. Sans saut, à ton rythme."};
  }
  let name,groups;
  if(profile.focus==='full'){name='Full body '+String.fromCharCode(65+i);
    groups=[['quadriceps',1],['fessiers',1],['dos',1],['pecs',1],['epaules',1],['ischios',1],['biceps',1],['triceps',1],['mollets',1]];
  } else {const sp=SPLITS[N]||SPLITS[3];const s=sp[i%sp.length];name=s[0];groups=[...s[1]]}
  let picked=[];
  const order=profile.focus==='full'?shuffled(groups,r):groups;
  order.forEach(([g,n])=>{const p=shuffled(poolFor(g,place),r);for(let k=0;k<n&&k<p.length;k++)picked.push(p[k])});
  picked=picked.slice(0,nEx);
  const locked=((profile.locks||{})['s'+i]||[]).map(byId).filter(e=>e&&e.p.includes(plOf(place)));
  locked.forEach(le=>{
    if(picked.some(e=>e.id===le.id))return;
    let k=picked.findIndex(e=>e.g===le.g&&!locked.some(l=>l.id===e.id));
    if(k<0)k=picked.findIndex(e=>!locked.some(l=>l.id===e.id));
    if(k>=0)picked[k]=le;else if(picked.length<nEx+1)picked.push(le);

  const ord=(profile.order||{})['s'+i];
  if(ord){const m=new Map(picked.map(e=>[e.id,e]));const out=[];ord.forEach(id=>{if(m.has(id)){out.push(m.get(id));m.delete(id)}});picked=out.concat([...m.values()])}

    const fv=FINISHERS[cp][Math.floor(r()*FINISHERS[cp].length)];

}

function estMin(s){let m=6;s.items.forEach(it=>{m+=it.kind==='lift'?s.sets*1.9:s.sets*1.1});if(s.cardio)m+=parseInt(s.cardio.dur)||12;return Math.round(m/5)*5}

/* ---------- charges conseillées ---------- */
function lastPerf(id){for(let i=logs.length-1;i>=0;i--){const L=logs[i];const e=(L.exos||[]).find(x=>x.id===id);if(e&&(e.best||e.rp))return {...e,d:L.d,feel:L.feel}}return null}
function incFor(ex){const q=ex.eq||'';if(/machine|poulie|barre/.test(q))return 2.5;if(/haltère|disque/.test(q))return 1;if(/bouteille|sac/.test(q))return 0.5;return 0}
function startKg(ex){const q=ex.eq||'';if(/machine|barre/.test(q))return 20;if(/poulie/.test(q))return 15;if(/disque/.test(q))return 10;if(/haltère/.test(q))return 6;return 2}

function suggest(id,kind){
  const ex=byId(id),reps=GOALS[profile.goal].reps,p=lastPerf(id);
  if(!ex)return {kg:'',reps,last:null,up:false};
  if(!p)return {kg:'',reps,last:null,up:false};
  if(!needsKg(ex,kind))return {kg:'',reps:Math.max(reps,+p.rp||0),last:p,up:false};
  let kg=+p.best||0,up=false;const inc=incFor(ex);
  if(kg&&inc&&p.full&&(+p.rp||0)>=reps&&p.feel!=='dur'){kg=Math.round((kg+inc*(p.feel==='facile'?2:1))*100)/100;up=true}
  return {kg:kg||'',reps,last:p,up}}
function holdInfo(ex){const r=ex.r||'30 s';const m=r.match(/(\d+)(?:\s*à\s*\d+)?\s*s\b/);return {sec:m?+m[1]:0,txt:r}}
function restSec(){return +(profile&&profile.rest)||(profile&&profile.place==='salle'?90:profile&&profile.place==='maison'?45:30)}

/* ---------- semaine : muscu + endurance ---------- */
function muscuDone(i,mon){const k=isoLocal(mondayOf(mon));return done.some(x=>x.i===i&&isoLocal(mondayOf(x.d))===k)}
function weekItems(mon){
  mon=mondayOf(mon);const items=[];
  profile.mDays.forEach((d,i)=>items.push({day:d,kind:'muscu',i,date:isoLocal(addDays(mon,d)),done:muscuDone(i,mon)}));
  if(cardio){const P=plan(),w=goalWeek(cardio,mon);
    if(P&&w>=0&&w<P.length){const days=runDaysFor(w);
      P[w].s.forEach((s,k)=>{const dt=isoLocal(addDays(mon,days[k]));if(daysBetween(cardio.date,dt)>0)return;
        items.push({day:days[k],kind:'run',w,k,s,date:dt,done:!!cardio.doneMap[w+'-'+k]})})}}
  items.forEach(x=>{x.skipped=!x.done&&isSkipped(x)});
  return items.sort((a,b)=>a.day-b.day||(a.kind==='run')-(b.kind==='run'))}
function itemTitle(it){return it.kind==='muscu'?(program[it.i]||buildSession(it.i)).name:it.s.t}
let todayOpt={dur:null,place:null,pick:null};
function todayPick(){
  const items=weekItems(new Date()),td=dowOf(new Date());
  if(todayOpt.pick){const p=items.find(x=>x.kind===todayOpt.pick.kind&&(x.kind==='muscu'?x.i===todayOpt.pick.i:x.k===todayOpt.pick.k));if(p&&!p.done&&!p.skipped)return {it:p,mode:'pick',items}}
  const und=items.filter(x=>!x.done&&!x.skipped);
  const t=und.filter(x=>x.day===td);if(t.length)return {it:t[0],mode:'today',items,also:t.slice(1)};
  const late=und.filter(x=>x.day<td);if(late.length)return {it:late[0],mode:'late',items};
  const nx=und.find(x=>x.day>td);
  return {it:nx||null,mode:nx?'rest':'weekdone',items}}

/* ---------- flamme ---------- */
function weekActs(wkKey){
  const m=done.filter(x=>isoWeek(x.d)===wkKey).length;
  const r=logs.filter(l=>l.kind==='run'&&isoWeek(l.d)===wkKey).length;
  return m+r}
function weekOf(off){return isoWeek(addDays(new Date(),-off*7))}
function weekGoal(){return Math.max(1,profile.days)}
function streakWeeks(){const g=weekGoal();let s=0,k=weekActs(weekOf(0))>=g?0:1;
  for(;k<260;k++){if(weekActs(weekOf(k))>=g)s++;else break}
  return s}

  for(let k=259;k>=0;k--){if(weekActs(weekOf(k))>=g){run++;if(run>best)best=run}else run=0}

let W=null;

async function keepAwake(on){try{
  if(on&&'wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen')}
  else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}

function newWorkout(idx){
  const s=buildSession(idx,{dur:todayOpt.dur||undefined,place:todayOpt.place||undefined});
  return {v:4,idx,name:s.name,kind:s.kind,place:s.place,dur:s.dur,startedAt:Date.now(),note:s.note||'',warm:false,warmChk:[],pos:0,
    items:s.items.map(it=>{const sg=suggest(it.id,it.kind);const ex=byId(it.id);
      return {id:it.id,kind:it.kind,sets:Array.from({length:s.sets},()=>({kg:needsKg(ex,it.kind)&&sg.kg!==''?String(sg.kg):'',reps:it.kind==='lift'?String(sg.reps):'',done:false}))}}),
    cardio:s.cardio?{...s.cardio,done:false}:null}}
function saveDraft(){draft=W;save('nx_draft',W)}
function steps(){const out=[];if(!W.warm)out.push('warm');W.items.forEach((x,i)=>out.push(i));if(W.cardio)out.push('cardio');return out}
function itemDone(it){return it.sets.every(s=>s.done)}
function openWorkout(idx,resume){
  W=(resume&&draft)?draft:newWorkout(idx);
  if(W.v!==4){W.v=4;W.warm=!!W.warmDone;W.warmChk=[];W.pos=0}
  if(!resume){todayOpt.dur=null;todayOpt.place=null;todayOpt.pick=null;W.pos=0}
  else{const st=steps();let p=st.findIndex(x=>x==='warm'||(typeof x==='number'&&!itemDone(W.items[x]))||(x==='cardio'&&!W.cardio.done));W.pos=p<0?st.length-1:p}
  saveDraft();$('#player').classList.add('on');document.body.style.overflow='hidden';keepAwake(true);renderPlayer();
}
function closePlayer(){closeRest();keepAwake(false);$('#player').classList.remove('on');document.body.style.overflow='';W=null;show('today')}
$('#plClose').onclick=()=>{

};

function renderPlayer(){

function stepper(cls,val,unit,ph){return `<div class="stp"><button data-a="${cls}" data-d="-1" aria-label="Moins">−</button><div class="val"><input class="${cls}" inputmode="decimal" value="${escapeHtml(val)}" placeholder="${ph||'0'}" aria-label="${unit}"><small>${unit}</small></div><button data-a="${cls}" data-d="1" aria-label="Plus">+</button></div>`}
let holdT=null;
function renderEx(i){
  const it=W.items[i],ex=byId(it.id),sg=suggest(it.id,it.kind),n=it.sets.length,cj=it.sets.findIndex(s=>!s.done);
  const kgOn=needsKg(ex,it.kind),hold=it.kind==='hold',hi=holdInfo(ex);

  const rowTxt=s=>hold?(hi.sec?hi.txt:hi.txt):(kgOn&&s.kg!==''?`${fmtN(parseN(s.kg))} kg × ${s.reps||'?'}`:`${s.reps||'?'} répétitions`);

    if(s.done)sets+=`<button class="setd" data-undo="${j}"><span class="ck">${ico('check','xs')}</span>Série ${j+1} · ${rowTxt(s)}<span class="ed">modifier</span></button>`;
    else if(j===cj){
      const last=sg.last?(kgOn&&sg.last.best?`la dernière fois ${fmtN(sg.last.best)} kg × ${sg.last.rp||'?'}`:sg.last.rp?`la dernière fois ${sg.last.rp} répétitions`:''):(kgOn?'première fois : prends une charge confortable':'');
      sets+=`<div class="cur-set"><div class="lbl"><span>SÉRIE ${j+1} SUR ${n}</span><span>${last}</span></div>
        ${hold?`<button class="holdbtn" id="holdB">${hi.sec?ico('clock','s')+'Lancer '+hi.sec+' s':escapeHtml(hi.txt)}</button>`
          :`<div class="steps ${kgOn?'':'one'}">${kgOn?stepper('ikg',s.kg,'kg','–'):''}${stepper('irp',s.reps,'répétitions',String(GOALS[profile.goal].reps))}</div>`}
        ${j===0&&kgOn&&warmupSets(ex,s.kg)&&!W.items.slice(0,i).some(o=>byId(o.id).g===ex.g&&needsKg(byId(o.id),o.kind))?`<div class="hint grey">${ico('heat','xs')}${warmupSets(ex,s.kg)}</div>`:''}
        ${j===0&&sg.up?`<div class="hint">${ico('up','xs')}Tout réussi la dernière fois : on monte à ${fmtN(sg.kg)} kg</div>`:''}
        ${j===0&&!sg.up&&sg.last&&sg.last.feel==='dur'&&kgOn?`<div class="hint grey">${ico('info','xs')}C'était dur la dernière fois : même charge</div>`:''}</div>`;
    } else sets+=`<div class="setd up"><span class="ck"></span>Série ${j+1} · ${rowTxt(s)}</div>`;
  });
  $('#plBody').innerHTML=`<div class="photo">${exMedia(ex)}<button class="how" id="howB">${ico('info','xs')}Comment faire</button>${pr?`<span class="pr">${ico('trophy','xs')}${fmtN(pr.kg)} kg</span>`:''}</div>
    <div class="exh"><div class="n">${escapeHtml(ex.n)}</div><div class="s">${sub}</div></div>
    ${note?`<div class="mynote">${ico('note','s')}<span>${escapeHtml(note)}</span></div>`:''}
    <div class="sets">${sets}</div>

/* ---------- semaines ratées : laisser tomber, alléger ---------- */
function itemKey(x){return x.kind==='muscu'?'m'+x.i:'r'+x.w+'-'+x.k}
function isSkipped(x){const a=(profile.skips||{})[isoWeek(x.date)]||[];return a.includes(itemKey(x))}
function skipItem(x,on){profile.skips=profile.skips||{};const wk=isoWeek(x.date);const a=profile.skips[wk]||[];const k=itemKey(x);
  const j=a.indexOf(k);if(on&&j<0)a.push(k);if(!on&&j>=0)a.splice(j,1);profile.skips[wk]=a;
  /* on ne garde que les 8 dernières semaines */
  Object.keys(profile.skips).sort().slice(0,-8).forEach(w=>delete profile.skips[w]);persist()}
function isLight(wk){return profile.light===(wk||weekKey())}
function plannedCount(mon){return weekItems(mon).length}
function weekBanner(){
  const wk=weekKey();if(isLight(wk)||(profile.bannerOff||'')===wk)return null;
  /* fatigue : au moins 2 séances « dur » sur les 3 dernières en 10 jours */
  const lim=isoLocal(addDays(new Date(),-10));
  const felt=logs.filter(l=>l.feel&&l.d>=lim).slice(-3);
  if(felt.filter(l=>l.feel==='dur').length>=2)return {k:'fatigue',t:'Tes dernières séances t\'ont paru dures',s:'Une semaine un peu plus légère aide le corps à récupérer et à progresser.'};
  /* reprise : semaine dernière très incomplète, avec un historique avant */
  const prevMon=addDays(mondayOf(new Date()),-7),pk=isoWeek(prevMon);
  const before=logs.some(l=>l.d<isoLocal(prevMon));
  const planned=plannedCount(prevMon),acts=weekActs(pk);
  if(before&&planned&&acts<planned/2)return {k:'reprise',t:'La semaine dernière a été calme',s:'On reprend en douceur : une série de moins par exercice cette semaine.'};
  return null}

/* ---------- GPS ---------- */
const GEO={watch:null,last:null,trail:[],err:null};
function hav(a,b){const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;
  const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function geoAvailable(){return 'geolocation' in navigator}
function geoStart(){
  if(!geoAvailable()){GEO.err='Le GPS n\'est pas disponible sur cet appareil';return}
  if(GEO.watch!=null)return;GEO.err=null;GEO.last=null;
  GEO.watch=navigator.geolocation.watchPosition(pos=>{
    const c=pos.coords;if(!RN)return;
    if(!profile.gps){profile.gps=true;save('nx_profile',profile)}
    if(c.accuracy>40){GEO.weak=true;return}GEO.weak=false;
    const p={t:pos.timestamp||Date.now(),lat:c.latitude,lon:c.longitude};
    if(RN.paused||RN.fin){GEO.last=p;return}
    if(GEO.last){const d=hav(GEO.last,p),dt=Math.max(.5,(p.t-GEO.last.t)/1000);
      if(d>0.003&&d/dt<0.014){RN.km=(RN.km||0)+d;RN.bkm=(RN.bkm||0)+d;GEO.trail.push({t:p.t,km:RN.km});if(GEO.trail.length>400)GEO.trail.shift();GEO.last=p}
      else if(d/dt>=0.014)GEO.last=p}
    else GEO.last=p;
  },err=>{GEO.err=err.code===1?'Accès à la position refusé : autorise-le dans les réglages du navigateur':'Position introuvable pour l\'instant';stopGeoWatch();if(RN)renderRun()},
  {enableHighAccuracy:true,maximumAge:2000,timeout:30000});
  if(RN){RN.gps=true;saveRun()}}
function stopGeoWatch(){if(GEO.watch!=null)try{navigator.geolocation.clearWatch(GEO.watch)}catch(e){}GEO.watch=null;GEO.last=null}
function geoStop(){stopGeoWatch();GEO.trail=[]}
/* allure des 60 dernières secondes, en s/km */
function curPace(){const t=GEO.trail;if(t.length<2)return 0;const end=t[t.length-1];let st=null;
  for(let i=t.length-2;i>=0;i--){st=t[i];if(end.t-t[i].t>=60000)break}
  const dk=end.km-st.km,ds=(end.t-st.t)/1000;return dk>0.04&&ds>10?ds/dk:0}
function racePaceSec(){if(!cardio||cardio.sport!=='course')return 0;const s=parseTarget(cardio.target);return s?s/(+cardio.dist):0}
function paceAdvice(z,p){const rp=racePaceSec();if(!rp||!p)return '';
  if(z==='course'||z==='soutenu'){const tg=z==='course'?rp:rp+15;const d=p-tg;
    return Math.abs(d)<=8?'Bonne allure':d>8?'Accélère un peu':'Un peu vite, garde des forces'}
  if(z==='facile'&&p<rp+30)return 'Ralentis, c\'est un footing';
  return ''}

/* ---------- estimation du temps de course (formule de Riegel) ---------- */
function predictRace(){
  if(!cardio||cardio.sport!=='course')return null;const D=+cardio.dist,lim=isoLocal(addDays(new Date(),-42));
  let best=null;
  logs.filter(l=>l.kind==='run'&&(l.sport||'course')==='course'&&+l.km>=Math.max(2,Math.min(3,D*0.3))&&l.d>=lim).forEach(l=>{
    const t=+l.sec||l.dur*60;if(!t)return;const pred=t*Math.pow(D/(+l.km),1.06);if(!best||pred<best.t)best={t:pred,from:l}});
  if(!best)return null;
  const tg=parseTarget(cardio.target);
  return {...best,diff:tg?best.t-tg:null}}
function predTxt(pr){if(!pr)return '';let s='Temps estimé '+mmss(pr.t);
  if(pr.diff!=null)s+=Math.abs(pr.diff)<15?', pile dans ton objectif':pr.diff<0?`, ${mmss(-pr.diff)} d'avance sur ton objectif`:`, encore ${mmss(pr.diff)} à gagner`;
  return s}

function exSeries(id){const out=[];logs.forEach(l=>{const e=(l.exos||[]).find(x=>x.id===id&&x.best);if(e)out.push({v:+e.best,d:l.d})});return out.slice(-12)}
function lineChart(pts,unit){
  if(pts.length<2)return '';
  const W=300,H=130,pl=30,pr=10,pt=12,pb=22;
  const vs=pts.map(p=>p.v);let mn=Math.min(...vs),mx=Math.max(...vs);if(mx===mn){mx+=1;mn=Math.max(0,mn-1)}
  const xs=pts.map((_,i)=>pl+i*(W-pl-pr)/(pts.length-1)),ys=pts.map(p=>pt+(1-(p.v-mn)/(mx-mn))*(H-pt-pb));
  const d=xs.map((x,i)=>(i?'L':'M')+x.toFixed(1)+' '+ys[i].toFixed(1)).join(' ');
  const mid=(mn+mx)/2,yMid=pt+(H-pt-pb)/2;

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progression">
    <line class="gd" x1="${pl}" y1="${pt}" x2="${W-pr}" y2="${pt}"/><line class="gd" x1="${pl}" y1="${yMid}" x2="${W-pr}" y2="${yMid}"/><line class="gd" x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}"/>

    $('#outBtn').onclick=()=>{logout();closeSheet()};
  } else {
    sheetOpen(`<h3>Connexion</h3><div class="sh-sub">Avec <b>le même compte que Cookie Do</b> : tes repas s'affichent et tes séances sont sauvegardées sur tous tes appareils.</div><div class="stack">
      <div class="fld"><label for="lEmail">E-mail</label><input type="email" id="lEmail" autocomplete="email"></div>
      <div class="fld"><label for="lPass">Mot de passe</label><input type="password" id="lPass" autocomplete="current-password"></div>
      <div id="lMsg"></div><button class="btn wide" id="inBtn">Se connecter</button>
      ${profile?`<div class="menu"><button id="accSet">${ico('gear')}<span><b>Réglages du programme</b></span></button></div>`:''}
      ${th}${diag}<div class="mini" style="text-align:center">Nexora ${APP_VERSION}</div></div>`);
    $('#inBtn').onclick=async()=>{const b=$('#inBtn');b.disabled=true;b.textContent='Connexion…';
      try{await login($('#lEmail').value.trim(),$('#lPass').value);closeSheet();toast('Connectée')}
      catch(e){$('#lMsg').innerHTML='<div class="msg err">'+escapeHtml(e.message)+'</div>';b.disabled=false;b.textContent='Se connecter'}};
    if($('#accSet'))$('#accSet').onclick=openSettings;
  }
  $$('#thSeg button').forEach(b=>b.onclick=()=>{setTheme(b.dataset.t);$$('#thSeg button').forEach(x=>x.classList.toggle('on',x.dataset.t===theme))});
  $('#forceUpd').onclick=forceUpdate;runDiag();
}

/* ---------- Supabase (compte partagé avec Cookie Do) ---------- */
async function sb(path,opts={},retry=true){
  const h={'apikey':SB_KEY,'Content-Type':'application/json',...(opts.headers||{})};
  if(session&&session.access_token)h['Authorization']='Bearer '+session.access_token;
  const r=await fetch(SB_URL+path,{...opts,headers:h});
  if(r.status===401&&retry&&session&&session.refresh_token){const ok=await refreshTok();if(ok)return sb(path,opts,false)}
  return r}
async function refreshTok(){try{const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)return false;const j=await r.json();session={access_token:j.access_token,refresh_token:j.refresh_token,user:j.user};save('nx_session',session);return true}catch(e){return false}}
async function login(email,pass){
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error_description||j.msg||'Connexion impossible, vérifie l\'e-mail et le mot de passe');
  session={access_token:j.access_token,refresh_token:j.refresh_token,user:j.user};save('nx_session',session);
  await pullState();await pullMeals();pushState();if(profile)refresh();else show('onb')}
function logout(){session=null;drop('nx_session');mealsCache=null;drop('nx_meals');refresh();toast('Déconnectée')}
async function pullMeals(){try{const r=await sb('/rest/v1/app_state?select=data');if(!r.ok)return;
  const rows=await r.json();const d=rows[0]&&rows[0].data;if(!d)return;
  const custom={};(d.custom||[]).forEach(c=>{if(c&&c.id)custom[c.id]=c.title});
  mealsCache={ids:d.selection||[],custom,at:Date.now()};save('nx_meals',mealsCache)}catch(e){}}
let pushT=null;
function pushState(){if(!session)return;clearTimeout(pushT);pushT=setTimeout(async()=>{
  try{save('nx_profile_at',Date.now());
    await sb('/rest/v1/nexora_state',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({user_id:session.user.id,data:{profile,done,logs,prs,cardio,meas},updated_at:new Date().toISOString()})})}catch(e){}},900)}
const logKey=l=>l.d+'|'+l.name+'|'+(l.dur||0)+'|'+(l.sets||0)+'|'+(l.km||'');
async function pullState(){try{const r=await sb('/rest/v1/nexora_state?select=data,updated_at');if(!r.ok)return;
  const rows=await r.json();const row=rows[0];const d=row&&row.data;if(!d)return;
  /* fusion : union des deux appareils, jamais d'écrasement */
  if(Array.isArray(d.logs)){const seen=new Set(logs.map(logKey));let add=0;
    d.logs.forEach(l=>{if(!seen.has(logKey(l))){logs.push(l);seen.add(logKey(l));add++}});
    if(add){logs.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);save('nx_logs',logs)}}
  if(Array.isArray(d.done)){const seen=new Set(done.map(x=>x.d+'|'+x.i));let add=0;
    d.done.forEach(x=>{if(!seen.has(x.d+'|'+x.i)){done.push(x);seen.add(x.d+'|'+x.i);add++}});
    if(add){done.sort((x,y)=>x.d<y.d?-1:1);save('nx_done',done)}}
  if(Array.isArray(d.meas)){let ch=0;d.meas.forEach(m=>{if(m&&m.d&&!meas.some(x=>x.d===m.d)){meas.push(m);ch++}});if(ch){meas.sort((a,b)=>a.d<b.d?-1:1);save('nx_meas',meas)}}
  if(d.prs){let ch=0;for(const k in d.prs){if(!prs[k]||d.prs[k].kg>prs[k].kg){prs[k]=d.prs[k];ch++}}if(ch)save('nx_prs',prs)}
  if(d.cardio){const rc=normGoal(d.cardio);
    if(!cardio)cardio=rc;
    else if(rc&&rc.id===cardio.id)cardio.doneMap=Object.assign({},rc.doneMap||{},cardio.doneMap||{});
    save('nx_cardio',cardio);planCache=null}
  if(d.profile){const remoteNewer=row.updated_at&&load('nx_profile_at',0)<new Date(row.updated_at).getTime();
    if(!profile)profile=d.profile;
    else{profile.locks=Object.assign({},d.profile.locks||{},profile.locks||{});
      profile.notes=Object.assign({},d.profile.notes||{},profile.notes||{});
      profile.skips=Object.assign({},d.profile.skips||{},profile.skips||{});
      if(remoteNewer)['goal','cardio','days','focus','place','dur','mDays','rest','name','light','gps'].forEach(k=>{if(d.profile[k]!==undefined)profile[k]=d.profile[k]})}
    profile=normProfile(profile);save('nx_profile',profile)}
  rebuild();
}catch(e){}}

/* ---------- carte partageable ---------- */
function shareCard(l){
  const S=2,W2=540*S,H2=675*S,c=document.createElement('canvas');c.width=W2;c.height=H2;const x=c.getContext('2d');
  const run=l.kind==='run';
  const gr=x.createLinearGradient(0,0,W2,H2);gr.addColorStop(0,run?'#C9501A':'#1565c0');gr.addColorStop(1,run?'#FF8A4C':'#42a5f5');
  x.fillStyle=gr;x.fillRect(0,0,W2,H2);x.fillStyle='rgba(255,255,255,.13)';
  [[80,120,220],[470,560,260]].forEach(([cx,cy,r])=>{x.beginPath();x.arc(cx*S,cy*S,r*S,0,7);x.fill()});
  const F=(w,s)=>`${w} ${s*S}px -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif`;
  x.fillStyle='#fff';x.font=F('800',26);x.fillText('NEXORA',44*S,72*S);
  x.font=F('600',15);x.globalAlpha=.85;x.fillText(fmtDate(l.d),44*S,102*S);x.globalAlpha=1;
  x.font=F('800',34);const words=String(l.name).split(' ');let line='',y=180;
  words.forEach(w=>{const t2=line?line+' '+w:w;if(x.measureText(t2).width>452*S){x.fillText(line,44*S,y*S);line=w;y+=42}else line=t2});
  x.fillText(line,44*S,y*S);
  const stats=run?[[l.dur+' min','durée'],[l.km?fmtN(l.km)+' km':'—','distance'],[l.km&&l.sport==='course'?mmss(l.dur*60/l.km):'—','allure /km']]:[[l.dur+' min','durée'],[l.sets,'séries'],[(l.vol||0)+' kg','soulevés']];
  stats.forEach(([v,k],i)=>{const bx=(44+i*156)*S,by=(y+40)*S;
    x.fillStyle='rgba(255,255,255,.17)';x.beginPath();if(x.roundRect)x.roundRect(bx,by,146*S,96*S,18*S);else x.rect(bx,by,146*S,96*S);x.fill();
    x.fillStyle='#fff';x.font=F('800',24);x.textAlign='center';x.fillText(String(v),bx+73*S,by+52*S);
    x.globalAlpha=.82;x.font=F('700',13);x.fillText(k,bx+73*S,by+76*S);x.globalAlpha=1;x.textAlign='left'});
  let ly=y+180;
  if(!run&&(l.exos||[]).length){x.font=F('700',16);x.globalAlpha=.85;x.fillText('Exercices',44*S,ly*S);x.globalAlpha=1;ly+=30;
    (l.exos||[]).slice(0,7).forEach(e=>{x.font=F('600',17);x.fillText(String(e.n).slice(0,28),44*S,ly*S);
      if(e.best){x.textAlign='right';x.globalAlpha=.85;x.fillText(fmtN(e.best)+' kg',496*S,ly*S);x.globalAlpha=1;x.textAlign='left'}ly+=30})}
  x.globalAlpha=.7;x.font=F('600',13);x.textAlign='center';x.fillText('Séance enregistrée avec Nexora',W2/2,(H2/S-34)*S);x.globalAlpha=1;
  c.toBlob(async blob=>{const file=new File([blob],'nexora-seance.png',{type:'image/png'});
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Ma séance'});return}}catch(e){}
    const u=URL.createObjectURL(blob),a3=document.createElement('a');a3.href=u;a3.download='nexora-seance.png';document.body.appendChild(a3);a3.click();a3.remove();
    setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Image enregistrée')},'image/png');
}

/* ---------- hors ligne, diagnostic, export ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
  /* la page est servie depuis le cache ; quand le service worker a trouvé une version plus récente, il le dit ici */
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='updated')showUpdate()});
  if(navigator.serviceWorker.startMessages)navigator.serviceWorker.startMessages();
}
function showUpdate(){const u=$('#upd');if(!u||!u.hidden)return;u.hidden=false;$('#updGo').onclick=()=>location.reload()}
function runDiag(){
  const box=$('#diagBox');if(!box)return;
  const mode=IMG_MAP?('manifeste, '+Object.keys(IMG_MAP).length+' images'):'automatique';
  const im=new Image();const fin=t=>{box.innerHTML=`Version ${APP_VERSION} · images ${mode} · test : <b>${t}</b>`};
  im.onload=()=>fin('images trouvées');im.onerror=()=>fin('images introuvables');im.src=IMG_DIR+'abduction.jpg?v='+Date.now()}
async function forceUpdate(){
  try{if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();
    rs.forEach(r=>{if(r.active)r.active.postMessage('clear')});await Promise.all(rs.map(r=>r.unregister()))}
    if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}
  location.reload()}
function doExport(){
  const blob=new Blob([JSON.stringify({profile,done,logs,prs,cardio,meas,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});
  const u=URL.createObjectURL(blob),a2=document.createElement('a');a2.href=u;a2.download='nexora-sauvegarde.json';document.body.appendChild(a2);a2.click();a2.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Sauvegarde téléchargée')}

/* ---------- démarrage ---------- */
(function boot(){
  if(cardio)save('nx_cardio',cardio);
  if(profile){save('nx_profile',profile);show('today');
    if(runDraft&&runDraft.s&&!runDraft.fin)toast('Une sortie est en pause');
    if(session){pullState().then(()=>{if(curView&&!W&&!RN)refresh()});pullMeals().then(()=>{if(curView==='today')renderToday()})}}
  else{show('onb');if(session)pullState().then(()=>{if(profile)show('today')})}
})();
</script>
